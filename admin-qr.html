<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亂碼 QR Code 產生器（僅供菲菲自己使用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="supabase-config.js"></script>
<style>
:root{
  --bg:#F8F4EF;--paper:#FFFDF9;--ink:#2C2824;--muted:#81776F;
  --line:#E8DED4;--rose:#C98F86;--rose-deep:#A66F68;
  --rose-soft:#F3E3DF;--blue-soft:#E9F0F3;--gold:#AE925F;
  --shadow:0 18px 55px rgba(53,42,35,.08)
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);font-family:'Noto Sans TC',sans-serif;
  background:
    radial-gradient(circle at 12% 0%, rgba(243,227,223,.72), transparent 28%),
    radial-gradient(circle at 90% 12%, rgba(233,240,243,.65), transparent 25%),
    var(--bg);
}
.wrap{max-width:520px;margin:0 auto;padding:40px 16px 72px}
.badge{
  display:block;text-align:center;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--rose-deep);font-weight:900;margin-bottom:10px
}
h1{
  font-family:'Noto Serif TC';font-size:26px;line-height:1.4;
  text-align:center;margin:0 0 6px
}
.note{
  text-align:center;color:var(--muted);font-size:12px;line-height:1.9;
  max-width:400px;margin:0 auto 30px
}
.sheet{
  background:rgba(255,253,249,.97);border-radius:28px;padding:28px 24px;
  box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.92)
}
label{
  display:block;font-size:10px;letter-spacing:.14em;
  color:var(--muted);font-weight:900;margin-bottom:9px
}
input{
  width:100%;border:1px solid var(--line);background:#FBF7F2;
  border-radius:16px;padding:14px 15px;font-size:15px;color:var(--ink);
  outline:none;font-family:monospace
}
input:focus{
  border-color:rgba(166,111,104,.4);
  box-shadow:0 0 0 3px rgba(201,143,134,.07)
}
.gen-btn{
  display:block;width:100%;margin-top:18px;text-align:center;border-radius:999px;
  padding:14px 22px;background:#5F4E48;color:#fff;font-size:13px;
  font-weight:900;border:none;cursor:pointer;box-shadow:0 9px 24px rgba(95,78,72,.11)
}
.gen-btn:active{opacity:.9}
.result{
  margin-top:26px;padding-top:24px;border-top:1px solid var(--line);
  text-align:center;display:none
}
.result.show{display:block}
#qrcode{
  display:inline-block;padding:16px;background:#fff;border-radius:20px;
  box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.92)
}
.url-display{
  margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--blue-soft);
  font-size:11px;color:#546069;word-break:break-all;font-family:monospace;line-height:1.7
}
.hint{
  margin-top:20px;padding:14px 16px;border-radius:16px;
  background:rgba(233,240,243,.62);font-size:11px;line-height:1.9;color:#6B7A82;
  border:1px solid rgba(140,162,176,.10)
}
.status{
  margin-top:14px;font-size:12px;line-height:1.8;display:none
}
.status.show{display:block}
.status.ok{color:#4C7A5B}
.status.err{color:#B3453F}
.gen-btn:disabled{opacity:.55;cursor:not-allowed}
.brand{
  text-align:center;margin-top:36px;padding:24px 12px 8px;border-top:1px solid var(--line)
}
.brand strong{font-family:'Noto Serif TC';font-size:12px;color:#6F655D}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">Soul Recipe · Internal Tool</div>
  <h1>亂碼 QR Code 產生器</h1>
  <p class="note">這頁只給你自己用，客人不會看到。核對完付款後，把亂碼貼進來，產生 QR code 傳給客人就好。</p>

  <div class="sheet">
    <label>這位客人的專屬亂碼</label>
    <input type="text" id="tokenInput" placeholder="例如 x7Yq9pLmN2Rk8" autocomplete="off">

    <label style="margin-top:16px">顯示名稱（不是必填，解鎖時會跟「歡迎回家」一起顯示）</label>
    <input type="text" id="nameInput" placeholder="例如 阿菲塔羅宇宙" autocomplete="off">

    <label style="margin-top:16px">管理密碼（只有你知道，這台裝置會記住，不用每次重打）</label>
    <input type="password" id="adminKeyInput" placeholder="管理密碼" autocomplete="off">

    <button class="gen-btn" id="genBtn">產生 QR Code</button>

    <div class="status" id="statusMsg"></div>

    <div class="result" id="result">
      <div id="qrcode"></div>
      <div class="url-display" id="urlDisplay"></div>
    </div>

    <div class="hint">
      按下「產生 QR Code」會直接把這組亂碼寫進資料庫，不用再自己跑 SQL。寫入成功才會顯示 QR code；長按（手機）或右鍵（電腦）圖片就可以存檔或直接傳給客人。
    </div>
  </div>

  <footer class="brand">
    <strong>靈魂配方使用手冊 · Soul Recipe Manual</strong>
    <div class="tagline" style="margin-top:8px"><a href="mailto:soulrecipe.tw@gmail.com" style="color:inherit;text-decoration:none">soulrecipe.tw@gmail.com</a></div>
  </footer>
</div>

<script>
const BASE_URL = 'https://feifei-soul-recipe.github.io/tarot-life-profile/unlock.html?key=';
const ADMIN_KEY_STORAGE = 'soulRecipeAdminKey';

const qrContainer = document.getElementById('qrcode');
const resultEl = document.getElementById('result');
const urlDisplayEl = document.getElementById('urlDisplay');
const statusEl = document.getElementById('statusMsg');
const genBtn = document.getElementById('genBtn');
const adminKeyInput = document.getElementById('adminKeyInput');

try{
  const savedKey = localStorage.getItem(ADMIN_KEY_STORAGE);
  if(savedKey) adminKeyInput.value = savedKey;
}catch(err){
  // localStorage 無法使用時，只是每次要重打管理密碼，不影響功能
}

function showStatus(kind, text){
  statusEl.className = 'status show ' + kind;
  statusEl.textContent = text;
}

document.getElementById('genBtn').addEventListener('click', async function(){
  const token = document.getElementById('tokenInput').value.trim();
  const displayName = document.getElementById('nameInput').value.trim();
  const adminKey = adminKeyInput.value.trim();

  if(!token){
    showStatus('err', '請先輸入這位客人的專屬亂碼');
    return;
  }
  if(!adminKey){
    showStatus('err', '請先輸入管理密碼');
    return;
  }

  resultEl.classList.remove('show');
  genBtn.disabled = true;
  showStatus('ok', '寫入資料庫中…');

  try{
    const res = await fetch(`${SOUL_RECIPE_SUPABASE_URL}/rest/v1/rpc/create_access_token`, {
      method: 'POST',
      headers: {
        'apikey': SOUL_RECIPE_SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SOUL_RECIPE_SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        input_token: token,
        input_display_name: displayName || null,
        input_admin_key: adminKey
      })
    });
    if(!res.ok){
      const errText = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}${errText ? '：' + errText.slice(0, 200) : ''}`);
    }
    const ok = await res.json();

    if(ok !== true){
      showStatus('err', '寫入失敗，管理密碼錯誤，或這組亂碼已經用過了。QR code 尚未產生，請確認後再試一次。');
      genBtn.disabled = false;
      return;
    }

    try{ localStorage.setItem(ADMIN_KEY_STORAGE, adminKey); }catch(err){}

    const fullUrl = BASE_URL + encodeURIComponent(token);
    qrContainer.innerHTML = '';
    new QRCode(qrContainer, {
      text: fullUrl,
      width: 220,
      height: 220,
      colorDark: '#2C2824',
      colorLight: '#ffffff'
    });
    urlDisplayEl.textContent = fullUrl;
    resultEl.classList.add('show');
    showStatus('ok', '✅ 已寫入資料庫，這組亂碼現在就能用，不用再手動跑 SQL。');
  }catch(err){
    showStatus('err', '連線失敗：' + (err && err.message ? err.message : '未知錯誤') + '。QR code 尚未產生。');
  }finally{
    genBtn.disabled = false;
  }
});
</script>
</body>
</html>
